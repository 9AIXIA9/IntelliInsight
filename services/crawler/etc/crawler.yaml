Name: crawler.rpc
ListenOn: ${SERVER_LISTEN_ON}

Consul:
  Host: ${CONSUL_HOST}
  Key: ${CONSUL_SERVICE_KEY}

MongoDB:
  URI: ${MONGODB_URI}
  Database: ${MONGODB_DATABASE}
  PostCollection: ${MONGODB_POST_COLLECTION}
  TaskCollection: ${MONGODB_TASK_COLLECTION}

TaskQueue:
  WorkQueueSize: ${TASK_QUEUE_WORK_QUEUE_SIZE}
  MaxWorkers: ${TASK_QUEUE_MAX_WORKERS}

Resource:
  DataBasePath: ${RESOURCE_DATA_BASE_PATH}
  IPs: [ "localhost", "127.0.0.1" ]
  FingerPrints: [ ]
  BrowserPath: ${RESOURCE_BROWSER_PATH}
  Headless: ${RESOURCE_HEADLESS}
  MaxPoolSize: ${RESOURCE_MAX_SIZE}
  InitialSize: ${RESOURCE_INITIAL_SIZE}
  HealthCheckInterval: ${RESOURCE_HEALTH_CHECK_INTERVAL}
  LoadBalancingStrategy: ${RESOURCE_LOAD_BALANCING_STRATEGY}
